<!DOCTYPE html>
<html>
  <head>
    <meta charset="utf-8" />
    <title>Eva Wagner — Photography</title>
    <script>
      // GitHub Pages SPA redirect.
      // When a visitor hits a deep link (e.g. /project/123), GH Pages returns a
      // 404 because there is no actual file at that path. This page encodes the
      // original path as a query-string and redirects to the root, where the
      // main app picks it up and restores it via history.replaceState.
      var segmentCount = 1; // = path segments before the app root (1 for /eva-website)
      var l = window.location;
      l.replace(
        l.protocol + '//' + l.hostname + (l.port ? ':' + l.port : '') +
        l.pathname.split('/').slice(0, 1 + segmentCount).join('/') + '/?/' +
        l.pathname.slice(1).split('/').slice(segmentCount).join('/').replace(/&/g, '~and~') +
        (l.search ? '&' + l.search.slice(1).replace(/&/g, '~and~') : '') +
        l.hash
      );
    </script>
  </head>
</html>
